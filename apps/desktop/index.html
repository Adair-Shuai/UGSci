<!doctype html>
<html class="desktop">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: inherit;
        gap: 12px;
      }

      .ugsci-loading-logo {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.5px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
        line-height: 1;
        color: #1f1f1f;
        animation: ugsci-loading-fade 0.5s ease-out both;
      }
      .ugsci-loading-sci {
        color: #2563EB;
      }
      @keyframes ugsci-loading-fade {
        from { opacity: 0; transform: scale(0.85); }
        to { opacity: 1; transform: scale(1); }
      }
      html[data-theme='dark'] .ugsci-loading-logo {
        color: #f0f0f0;
      }
    </style>
  </head>
  <body style="height: 100%">
    <script>
      (function () {
        var theme = 'system';
        try {
          theme = localStorage.getItem('theme') || 'system';
        } catch (_) {}
        var systemTheme =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        var resolvedTheme = theme === 'system' ? systemTheme : theme;
        if (resolvedTheme === 'dark' || resolvedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', resolvedTheme);
        }
        // Renderer-side reloads (Cmd+R / webContents.reload) don't go through
        // the main process's `?lng=` injection, so prefer the i18next cache —
        // the actual user setting persisted by the language switcher — before
        // falling back to the URL param or navigator detection.
        var urlParams = new URLSearchParams(window.location.search);
        var locale;
        try {
          locale = localStorage.getItem('i18nextLng');
        } catch (_) {}
        if (!locale) locale = urlParams.get('lng') || navigator.language || 'zh-CN';
        document.documentElement.lang = locale;
        var rtl = ['ar', 'arc', 'dv', 'fa', 'ha', 'he', 'khw', 'ks', 'ku', 'ps', 'ur', 'yi'];
        document.documentElement.dir =
          rtl.indexOf(locale.split('-')[0].toLowerCase()) >= 0 ? 'rtl' : 'ltr';
      })();
    </script>
    <div id="loading-screen">
      <div class="ugsci-loading-logo" role="status" aria-label="Loading">
        UG<span class="ugsci-loading-sci">Sci</span>
      </div>
    </div>
    <div id="root" style="height: 100%"></div>
    <script>
      window.__SERVER_CONFIG__ = undefined;
    </script>
    <script type="module" src="../../src/spa/entry.desktop.tsx"></script>
  </body>
</html>
