<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UGSci</title>
    <style>
      .drag-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        -webkit-app-region: drag;
      }

      body {
        margin: 0;
        padding: 48px 0 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }

      .container {
        text-align: center;
      }

      .ugsci-logo {
        font-size: 52px;
        font-weight: 700;
        letter-spacing: -0.5px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
        line-height: 1;
        color: #1f1f1f;
        animation: ugsci-fade-in 0.6s ease-out both;
      }

      .ugsci-logo-sci {
        color: #2563EB;
      }

      @keyframes ugsci-fade-in {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-color-scheme: dark) {
        .ugsci-logo {
          color: #f0f0f0;
        }
      }
    </style>
  </head>
  <body>
    <div class="drag-bar"></div>
    <div class="container">
      <div class="ugsci-logo" role="status" aria-label="UGSci Loading">
        UG<span class="ugsci-logo-sci">Sci</span>
      </div>
    </div>
  </body>
</html>
